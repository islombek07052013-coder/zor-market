<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZO'R market - Admin Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .uzum-purple { background-color: #7000FF; }
        .uzum-purple-text { color: #7000FF; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">

    <!-- Parol Modal -->
    <div id="adminLoginModal" class="fixed inset-0 bg-black/70 flex items-center justify-center z-50 p-4">
        <div class="bg-white rounded-3xl p-6 w-full max-w-sm shadow-2xl text-center space-y-4">
            <h3 class="font-black text-xl">Admin Panel</h3>
            <p class="text-xs text-gray-500">Parolni kiriting (`islom_9045`):</p>
            <input type="password" id="adminSecretInput" placeholder="Parol..." class="w-full border p-3 rounded-xl text-xs text-center outline-none font-bold">
            <button onclick="checkAdminPassword()" class="w-full bg-red-600 text-white py-3 rounded-xl text-xs font-bold">Kirish</button>
        </div>
    </div>

    <!-- Admin Dashboard -->
    <div id="adminDashboard" class="hidden min-h-screen flex flex-col">
        <header class="bg-white shadow-sm px-6 py-4 flex justify-between items-center border-b">
            <h1 class="text-lg font-black uzum-purple-text">Boshqaruv Paneli</h1>
            <button onclick="sessionStorage.removeItem('admin_auth'); location.reload();" class="bg-red-50 text-red-600 px-4 py-2 rounded-xl text-xs font-bold">Chiqish</button>
        </header>

        <main class="max-w-4xl mx-auto p-6 flex-1 w-full space-y-6">
            <div class="bg-white p-5 rounded-2xl shadow-sm border space-y-3">
                <h3 class="font-bold text-sm" id="formTitle">Yangi mahsulot qo'shish</h3>
                <input type="hidden" id="editIndex" value="-1">
                <input type="text" id="pName" placeholder="Mahsulot nomi" class="w-full border p-2.5 rounded-xl text-xs">
                <input type="number" id="pPrice" placeholder="Narxi (so'mda)" class="w-full border p-2.5 rounded-xl text-xs">
                <input type="text" id="pImg" placeholder="Rasm URL havolasi" class="w-full border p-2.5 rounded-xl text-xs">
                <select id="pCat" class="w-full border p-2.5 rounded-xl text-xs">
                    <option value="fruits">Meva va sabzavot</option>
                    <option value="dairy">Sut va tuxum</option>
                    <option value="bakery">Non va pishiriq</option>
                    <option value="sweets">Shirinliklar</option>
                    <option value="meat">Go'sht va baliq</option>
                    <option value="beverages">Ichimliklar</option>
                </select>
                <div class="flex space-x-2">
                    <button onclick="saveProduct()" id="saveBtn" class="uzum-purple text-white px-5 py-2.5 rounded-xl text-xs font-bold">Qo'shish</button>
                    <button onclick="resetForm()" id="cancelBtn" class="hidden bg-gray-200 text-gray-700 px-4 py-2.5 rounded-xl text-xs font-bold">Bekor qilish</button>
                </div>
            </div>

            <div class="bg-white p-5 rounded-2xl shadow-sm border">
                <h3 class="font-bold text-sm mb-3">Mavjud mahsulotlar</h3>
                <div id="productList" class="space-y-2"></div>
            </div>

            <div class="bg-white p-5 rounded-2xl shadow-sm border">
                <h3 class="font-bold text-sm mb-3">Kelib tushgan buyurtmalar</h3>
                <div id="orderList" class="space-y-3"></div>
            </div>
        </main>
    </div>

    <script>
        const MY_SECRET_PIN = "islom_9045";

        window.onload = function() {
            if (sessionStorage.getItem('admin_auth') === "true") showDashboard();
        }

        function checkAdminPassword() {
            if (document.getElementById('adminSecretInput').value.trim() === MY_SECRET_PIN) {
                sessionStorage.setItem('admin_auth', "true");
                showDashboard();
            } else {
                alert("Xato parol!");
            }
        }

        function showDashboard() {
            document.getElementById('adminLoginModal').classList.add('hidden');
            document.getElementById('adminDashboard').classList.remove('hidden');
            renderProducts();
            renderOrders();
        }

        function saveProduct() {
            let id = document.getElementById('editIndex').value;
            let name = document.getElementById('pName').value;
            let price = Number(document.getElementById('pPrice').value);
            let image = document.getElementById('pImg').value || "https://images.unsplash.com/photo-1542838132-92c53300491e?w=400";
            let category = document.getElementById('pCat').value;
            
            if(!name || !price) return alert("Ma'lumotlarni to'ldiring!");

            let products = JSON.parse(localStorage.getItem('zor_products')) || [];

            if (id === "-1") {
                // Yangi qo'shish
                products.push({ id: Date.now(), name, price, category, image, hasDiscount: false });
                alert("Mahsulot qo'shildi!");
            } else {
                // O'zgartirish (Tahrirlash)
                products[id].name = name;
                products[id].price = price;
                products[id].category = category;
                products[id].image = image;
                alert("Mahsulot narxi va ma'lumotlari o'zgartirildi!");
            }

            localStorage.setItem('zor_products', JSON.stringify(products));
            resetForm();
            renderProducts();
        }

        function renderProducts() {
            let list = document.getElementById('productList');
            let products = JSON.parse(localStorage.getItem('zor_products')) || [];
            list.innerHTML = products.length === 0 ? '<p class="text-xs text-gray-400">Mahsulotlar yo‘q</p>' : '';
            
            products.forEach((p, index) => {
                list.innerHTML += `
                    <div class="flex justify-between items-center bg-gray-50 p-2.5 rounded-xl border text-xs">
                        <div class="flex items-center space-x-3">
                            <img src="${p.image}" class="w-10 h-10 object-cover rounded-lg">
                            <div><b>${p.name}</b><br><span class="text-emerald-600 font-bold">${p.price.toLocaleString()} so'm</span></div>
                        </div>
                        <div class="space-x-1">
                            <button onclick="editProduct(${index})" class="bg-blue-50 text-blue-600 px-3 py-1.5 rounded-lg font-bold">O'zgartirish</button>
                            <button onclick="deleteProduct(${p.id})" class="bg-red-50 text-red-600 px-3 py-1.5 rounded-lg font-bold">O'chirish</button>
                        </div>
                    </div>`;
            });
        }

        function editProduct(index) {
            let products = JSON.parse(localStorage.getItem('zor_products')) || [];
            let p = products[index];
            
            document.getElementById('editIndex').value = index;
            document.getElementById('pName').value = p.name;
            document.getElementById('pPrice').value = p.price;
            document.getElementById('pImg').value = p.image;
            document.getElementById('pCat').value = p.category;

            document.getElementById('formTitle').innerText = "Mahsulotni tahrirlash";
            document.getElementById('saveBtn').innerText = "Saqlash";
            document.getElementById('cancelBtn').classList.remove('hidden');
        }

        function resetForm() {
            document.getElementById('editIndex').value = "-1";
            document.getElementById('pName').value = '';
            document.getElementById('pPrice').value = '';
            document.getElementById('pImg').value = '';
            document.getElementById('formTitle').innerText = "Yangi mahsulot qo'shish";
            document.getElementById('saveBtn').innerText = "Qo'shish";
            document.getElementById('cancelBtn').classList.add('hidden');
        }

        function deleteProduct(id) {
            let products = JSON.parse(localStorage.getItem('zor_products')) || [];
            products = products.filter(p => p.id !== id);
            localStorage.setItem('zor_products', JSON.stringify(products));
            renderProducts();
        }

        function renderOrders() {
            let list = document.getElementById('orderList');
            let orders = JSON.parse(localStorage.getItem('zor_orders')) || [];
            list.innerHTML = orders.length === 0 ? '<p class="text-xs text-gray-400">Buyurtmalar yo‘q</p>' : '';
            orders.forEach(o => {
                let itemsStr = o.items.map(i => `${i.name} (${i.qty}ta)`).join(', ');
                list.innerHTML += `<div class="bg-gray-50 p-3 rounded-xl border text-xs space-y-1"><b>Tel:</b> ${o.phone} | <b>Manzil:</b> ${o.address}<br><b>Mahsulot:</b> ${itemsStr}<br><b class="text-emerald-600">Jami: ${o.total.toLocaleString()} so'm</b> (${o.date})</div>`;
            });
        }
    </script>
</body>
</html>
